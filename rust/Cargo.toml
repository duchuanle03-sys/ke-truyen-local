[package]
name = "reader_local"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision", "raw_value"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
regex = "1"
quick-xml = "0.39"
getrandom = "0.3"
httpdate = "1"
fs4 = "1.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
brotli = "8"
scraper = { version = "0.25", default-features = false }
url = "2.5"

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
